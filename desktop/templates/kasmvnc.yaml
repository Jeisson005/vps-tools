desktop:
  resolution:
    width: 1920
    height: 1080
  allow_resize: true
  pixel_depth: 24

network:
  protocol: http
  interface: 127.0.0.1
  websocket_port: 8445
  use_ipv4: true
  use_ipv6: true
  ssl:
    require_ssl: false

logging:
  log_writer_name: all
  log_dest: logfile
  level: 30

security:
  brute_force_protection:
    blacklist_threshold: 0
    blacklist_timeout: 0

data_loss_prevention:
  clipboard:
    server_to_client:
      enabled: true
    client_to_server:
      enabled: true
  keyboard:
    enabled: true

encoding:
  max_frame_rate: 60

server:
  http:
    httpd_directory: /usr/share/kasmvnc/www
  advanced:
    kasm_password_file: ${HOME}/.kasmpasswd
  auto_shutdown:
    no_user_session_timeout: 300
    inactive_user_session_timeout: 3600

command_line:
  prompt: false
