# ==============================================================================
# NGINX Configuration for MCP Gateway (mcp.jeisson.top)
# Place or symlink in /nginx/conf.d/
# ==============================================================================

server {
  listen 80;
  server_name mcp.jeisson.top;

  # Logs
  access_log /dev/stdout;
  access_log /var/log/nginx/mcp.access.log;
  error_log  /dev/stderr warn;

  # ACME HTTP-01 challenge (LetsEncrypt)
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
  }

  # MCP Gateway (Admin UI, SSE, Streamable-HTTP & Subroutes)
  location / {
    proxy_pass http://mcp-gateway:8000;
    proxy_http_version 1.1;
    
    # Crucial for SSE & Realtime MCP tool streams
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Standard proxy headers
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
