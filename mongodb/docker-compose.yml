services:
  db:
    image: "mongo:7.0"
    env_file:
      - .env
    command:
      - mongod
      - --auth
    ports:
      - "0.0.0.0:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
      - mongoconfig:/data/configdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "mongodb_db_{{.Name}}"
    deploy:
      resources:
        limits:
          cpus: ${MONGO_CPUS}
          memory: ${MONGO_MEM_LIMIT}
        reservations:
          cpus: ${MONGO_CPUS_RESERVATION}
          memory: ${MONGO_MEM_RESERVATION}

volumes:
  mongodata:
  mongoconfig:
