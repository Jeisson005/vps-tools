services:
  db:
    image: "mongo:7.0"
    env_file:
      - .env
    command: mongod --auth ${MONGO_EXTRA_ARGS:-}
    ports:
      - "${MONGO_BIND_ADDR:-0.0.0.0}:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
      - mongoconfig:/data/configdb
    restart: unless-stopped
    # Healthcheck barato: comprueba que mongod escucha, sin arrancar un
    # proceso Node (mongosh) en cada intento. En VPS pequeños, un mongosh cada
    # 10s agota el límite de memoria del contenedor y el OOM killer lo mata en
    # bucle, dejando el contenedor como unhealthy para siempre (incidente
    # 2026-09-30). Un ping TCP cuesta kilobytes.
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/27017'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "mongodb_db_{{.Name}}"
    deploy:
      resources:
        limits:
          cpus: ${MONGO_CPUS}
          memory: ${MONGO_MEM_LIMIT}
        reservations:
          cpus: ${MONGO_CPUS_RESERVATION}
          memory: ${MONGO_MEM_RESERVATION}

volumes:
  mongodata:
  mongoconfig:
