# Default server: closes unknown hosts and provides healthcheck endpoint
# NOTE: Only port 80 is handled here. A TLS default_server would require a fallback certificate.

server {
  listen 80 default_server;
  server_name _;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  # Healthcheck used by docker-compose healthcheck
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # ACME HTTP-01 challenge (LetsEncrypt)
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
  }

  # Drop everything else
  location / {
    return 444;
  }
}

# Default TLS server: reject handshake for unknown hosts.
# Requires nginx >= 1.19.4.
server {
  listen 443 ssl default_server;
  server_name _;

  ssl_reject_handshake on;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  return 444;
}
