# Template: API Key Authentication
# Variables: API_KEY

# Check X-API-Key, Authorization: Bearer <API_KEY>, or ?key=<API_KEY> / ?api_key=<API_KEY>
set $auth_apikey_ok 0;

if ($http_x_api_key = "{{API_KEY}}") {
  set $auth_apikey_ok 1;
}

if ($http_authorization = "Bearer {{API_KEY}}") {
  set $auth_apikey_ok 1;
}

if ($arg_key = "{{API_KEY}}") {
  set $auth_apikey_ok 1;
}

if ($arg_api_key = "{{API_KEY}}") {
  set $auth_apikey_ok 1;
}

if ($auth_apikey_ok = 0) {
  add_header Content-Type application/json always;
  return 401 '{"error": "Unauthorized", "message": "Invalid or missing API Key in X-API-Key header, Authorization Bearer, or ?key= query parameter"}\n';
}
