# Template: API Key Authentication
# Variables: API_KEY

# Check X-API-Key and Authorization: Bearer <API_KEY>
set $auth_apikey_ok 0;

if ($http_x_api_key = "{{API_KEY}}") {
  set $auth_apikey_ok 1;
}

if ($http_authorization = "Bearer {{API_KEY}}") {
  set $auth_apikey_ok 1;
}

if ($auth_apikey_ok = 0) {
  add_header Content-Type application/json always;
  return 401 '{"error": "Unauthorized", "message": "Invalid or missing API Key in X-API-Key or Authorization Bearer header"}\n';
}
