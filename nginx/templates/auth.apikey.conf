# Template: API Key Authentication
# Variables: API_KEY

# Accepts the key via X-API-Key, Authorization: Bearer <API_KEY>,
# or the ?key=<API_KEY> / ?api_key=<API_KEY> query parameter.
#
# NOTE: the error body's type is set with `default_type`, not
# `add_header Content-Type`. The latter appends a SECOND Content-Type header
# next to nginx's default (application/octet-stream), and strict HTTP clients
# reject responses carrying duplicate Content-Type headers.
default_type application/json;

set $auth_apikey_ok 0;

if ($http_x_api_key = "{{API_KEY}}") {
  set $auth_apikey_ok 1;
}

if ($http_authorization = "Bearer {{API_KEY}}") {
  set $auth_apikey_ok 1;
}

if ($arg_key = "{{API_KEY}}") {
  set $auth_apikey_ok 1;
}

if ($arg_api_key = "{{API_KEY}}") {
  set $auth_apikey_ok 1;
}

if ($auth_apikey_ok = 0) {
  return 401 '{"error": "Unauthorized", "message": "Invalid or missing API Key in X-API-Key header, Authorization Bearer, or ?key= query parameter"}\n';
}
