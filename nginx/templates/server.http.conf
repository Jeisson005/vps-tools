# Template: HTTP server (port 80)
# Variables: SERVER_NAME, ACCESS_LOG_FILE, DEFAULT_LOCATION_BLOCK, INCLUDE_LOCATIONS_GLOB

server {
  listen 80;
  server_name {{SERVER_NAME}};

  access_log /dev/stdout;
  access_log /var/log/nginx/{{ACCESS_LOG_FILE}};
  error_log  /dev/stderr warn;

  # Security headers (baseline; no HSTS over HTTP)
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # ACME HTTP-01 challenge (LetsEncrypt)
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
  }

{{INCLUDE_LOCATIONS_GLOB}}

{{DEFAULT_LOCATION_BLOCK}}
}
