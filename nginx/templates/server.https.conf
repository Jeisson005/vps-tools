# Template: HTTPS (443) + redirect (80)
# Variables: SERVER_NAME, ACCESS_LOG_FILE, DEFAULT_LOCATION_BLOCK, INCLUDE_LOCATIONS_GLOB

# HTTP -> HTTPS (except for the challenge)
server {
  listen 80;
  server_name {{SERVER_NAME}};

  access_log /dev/stdout;
  access_log /var/log/nginx/{{ACCESS_LOG_FILE}};
  error_log  /dev/stderr warn;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS reverse proxy
server {
  listen 443 ssl http2;
  server_name {{SERVER_NAME}};

  access_log /dev/stdout;
  access_log /var/log/nginx/{{ACCESS_LOG_FILE}};
  error_log  /dev/stderr warn;

  ssl_certificate     /etc/letsencrypt/live/{{SERVER_NAME}}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/{{SERVER_NAME}}/privkey.pem;

  # TLS hardening (baseline)
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;

  # TLS 1.2 ciphers (TLS 1.3 ciphers are not configurable here)
  ssl_prefer_server_ciphers off;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

  # OCSP stapling
  resolver 127.0.0.11 ipv6=off valid=30s;
  resolver_timeout 5s;
  ssl_stapling on;
  ssl_stapling_verify on;

  # Security headers (baseline; CSP depends on the app)
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=15552000" always;

{{INCLUDE_LOCATIONS_GLOB}}

{{DEFAULT_LOCATION_BLOCK}}
}
