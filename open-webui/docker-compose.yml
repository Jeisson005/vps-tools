services:
  open-webui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:main}
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:-8080}:8080"
    volumes:
      - ${OPEN_WEBUI_DATA_DIR:-./data/open-webui}:/app/backend/data
      - ${OPEN_WEBUI_WORKSPACE_DIR:-./data/workspace}:/workspace
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
      - WEBUI_AUTH=${WEBUI_AUTH:-true}
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-true}
      - WEBUI_NAME=${WEBUI_NAME:-Open WebUI}
      - ENABLE_OPENAI_API=${ENABLE_OPENAI_API:-true}
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-http://host.docker.internal:8642/v1}
      - OPENAI_API_BASE_URLS=${OPENAI_API_BASE_URLS:-http://host.docker.internal:8642/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-hermes-api-secret-2026}
      - OPENAI_API_KEYS=${OPENAI_API_KEYS:-hermes-api-secret-2026}
      - DEFAULT_MODELS=${DEFAULT_MODELS:-hermes-agent}
      - RAG_FULL_CONTEXT=${RAG_FULL_CONTEXT:-true}
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - ENABLE_RAG_WEB_SEARCH=false
      - ENABLE_COMMUNITY_SHARING=false
      - UPLOAD_DIR=/app/backend/data/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - nginx_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
  nginx_network:
    name: ${NGINX_NETWORK:-nginx_default}
    external: true
