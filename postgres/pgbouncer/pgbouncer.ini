[databases]
# Route all databases to the postgres container; clients specify DB name
* = host=db port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
# Use SCRAM-SHA-256 for authentication (requires PgBouncer >= 1.25 and Postgres >= 10/18)
auth_type = scram-sha-256
# Static auth files (userlist.txt) are deprecated here. Prefer using
# auth_user + auth_query so PgBouncer reads SCRAM verifiers directly from
# Postgres, or populate an auth file from Postgres verifiers if strictly required.
# If you still need a static file, the format for SCRAM verifiers is:
auth_file = /etc/pgbouncer/userlist.txt

# Use the main user to query for others (requires that pguser matches the entry in userlist.txt)
auth_user = pguser
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1

pool_mode = transaction
max_client_conn = 20
default_pool_size = 2
reserve_pool_size = 0
server_reset_query = DISCARD ALL
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
ignore_startup_parameters = extra_float_digits

# Tune these values for your environment if needed
# Note: for auth_type = scram-sha-256, maintainers usually prefer using
# auth_user+auth_query so you don't have to keep static files in sync.
