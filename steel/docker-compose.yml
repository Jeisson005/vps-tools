services:
  steel:
    image: ghcr.io/steel-dev/steel-browser:latest
    container_name: steel-browser
    restart: unless-stopped
    ports:
      - "${STEEL_PORT:-3000}:3000"
      - "${STEEL_CDP_PORT:-9223}:9223"
    volumes:
      - ./data/steel-cache:/app/.cache
      - ./data/steel-chrome:/tmp/steel-chrome
    environment:
      - STEEL_API_KEY=${STEEL_API_KEY:-}
      - PORT=3000
      - CDP_PORT=9223
      - USE_SSL=${USE_SSL:-true}
      - DOMAIN=${STEEL_DOMAIN:-browser.localhost}
      - NODE_ENV=production
      - LOG_LEVEL=${STEEL_LOG_LEVEL:-info}
      - TIMEOUT_MS=${STEEL_TIMEOUT_MS:-3600000}
      - CONCURRENCY=${STEEL_CONCURRENCY:-5}
    shm_size: ${STEEL_SHM_SIZE:-1gb}
    cap_add:
      - SYS_ADMIN
    deploy:
      resources:
        limits:
          memory: 2.5G
